name: Release Publish

# This workflow is part of the Redis OSS release automation process.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to build'
        required: true
      release_type:
        description: 'Type of release to upload (public, internal)'
        required: true
      workflow_uuid:
        description: 'Optional UUID to identify this workflow run'
        required: false
      release_handle:
        description: 'JSON string containing release handle information'
        required: true
      slack_channel_id:
        description: 'Slack channel ID to post notifications to'
        required: false
        type: string
        default: ''
      slack_thread_ts:
        description: 'Thread timestamp to post message as a reply (optional)'
        required: false
        type: string
        default: ''

# UUID is used to help automation to identify workflow run in the list of workflow runs.
run-name: "Release Publish${{ github.event.inputs.workflow_uuid && format(': {0}', github.event.inputs.workflow_uuid) || '' }}"

# repo-add rewrites the whole database, so publishes to one repository must not overlap.
concurrency:
  group: release-publish-${{ github.event.inputs.release_type }}
  cancel-in-progress: false

jobs:
  upload-packages:
    runs-on: ubuntu-latest
    # The environment holds the ARCH_* variables of the channel, and it is what
    # the AWS role trusts, so only the branches it allows can sign and publish.
    environment: ${{ github.event.inputs.release_type == 'public' && 'production' || 'staging' }}
    permissions:
      # to configure-aws-credentials with a role
      id-token: write
      # to merge changes into release
      contents: write
      # to download artifacts from build workflow
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup slack message routing
        id: slack-routing
        env:
          INPUTS_SLACK_CHANNEL_ID: ${{ github.event.inputs.slack_channel_id }}
          INPUTS_SLACK_THREAD_TS: ${{ github.event.inputs.slack_thread_ts }}
          INPUTS_RELEASE_TYPE: ${{ github.event.inputs.release_type }}
          VARS_SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
        run: |
          if [ "$INPUTS_RELEASE_TYPE" == "public" ]; then
            # For public releases always post notifications to announcement channel
            echo "slack_channel_id=$VARS_SLACK_CHANNEL_ID" | tee -a "$GITHUB_OUTPUT"
            # Duplicate slack message links to the requested thread (if any)
            echo "slack_fanout_msg_links=1" | tee -a "$GITHUB_OUTPUT"
          elif [ -n "$INPUTS_SLACK_CHANNEL_ID" ]; then
            echo "slack_channel_id=$INPUTS_SLACK_CHANNEL_ID" | tee -a "$GITHUB_OUTPUT"
            echo "slack_thread_ts=$INPUTS_SLACK_THREAD_TS" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Validate inputs
        id: validate-inputs
        uses: ./.github/actions/release-channel
        with:
          release_tag: ${{ github.event.inputs.release_tag }}
          release_type: ${{ github.event.inputs.release_type }}

      - name: Ensure Release Branch
        id: ensure-branch
        uses: redis-developer/redis-oss-release-automation/.github/actions/ensure-release-branch@main
        with:
          release_tag: ${{ github.event.inputs.release_tag }}
          release_branch: ${{ github.ref_name }}
          allow_modify: false
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          release_version_branch_prefix: automation/

      - name: Parse release handle
        id: parse-handle
        uses: redis-developer/redis-oss-release-automation/.github/actions/parse-release-handle@main
        with:
          release_handle: ${{ github.event.inputs.release_handle }}

      - name: Check release handle tag
        if: steps.parse-handle.outputs.release_tag != github.event.inputs.release_tag
        run: |
          echo "::error::release_handle was built for '${{ steps.parse-handle.outputs.release_tag }}', not '${{ github.event.inputs.release_tag }}'"
          exit 1

      # Only a release was built from a committed recipe. Handles from before
      # run_type existed have none and are releases.
      - name: Check release handle run type
        env:
          HANDLE_RUN_TYPE: ${{ fromJSON(github.event.inputs.release_handle).run_type }}
        run: |
          if [ -n "$HANDLE_RUN_TYPE" ] && [ "$HANDLE_RUN_TYPE" != "release" ]; then
            echo "::error::release_handle is from a '$HANDLE_RUN_TYPE' run, only release runs are published"
            exit 1
          fi

      - name: Upload packages
        id: upload
        uses: ./.github/actions/upload-packages
        with:
          run_id: ${{ steps.parse-handle.outputs.run_id }}
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          release_type: ${{ github.event.inputs.release_type }}
          repo_name: ${{ steps.validate-inputs.outputs.repo_name }}
          GPG_KEY: ${{ secrets.GPG_KEY }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
          ARCH_KMS_KEY_ID: ${{ vars.ARCH_KMS_KEY_ID }}
          ARCH_S3_BUCKET: ${{ vars.ARCH_S3_BUCKET }}
          ARCH_S3_REGION: ${{ vars.ARCH_S3_REGION }}
          ARCH_S3_IAM_ARN: ${{ vars.ARCH_S3_IAM_ARN }}
          ARCH_S3_PREFIX: ${{ steps.validate-inputs.outputs.s3_prefix }}

      - name: Merge back to release branch
        id: merge-back
        # merge only public releases into mainline
        if: github.event.inputs.release_type == 'public'
        uses: redis-developer/redis-oss-release-automation/.github/actions/merge-branches-verified@main
        with:
          from_branch: ${{ steps.ensure-branch.outputs.release_version_branch }}
          to_branch: ${{ steps.ensure-branch.outputs.release_branch }}
          gh_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create version tag
        uses: redis-developer/redis-oss-release-automation/.github/actions/create-tag-verified@main
        if: steps.merge-back.outputs.merge_commit_sha != ''
        with:
          tag: v${{ github.event.inputs.release_tag }}
          ref: ${{ steps.merge-back.outputs.merge_commit_sha }}
          gh_token: ${{ secrets.GITHUB_TOKEN }}

      # Internal releases without a requested channel have no success message
      - name: Send Success Slack notification
        id: slack-success
        if: steps.slack-routing.outputs.slack_channel_id != ''
        continue-on-error: true
        uses: ./.github/actions/slack-notification
        with:
          slack_func: slack_format_success_message
          slack_channel_id: ${{ steps.slack-routing.outputs.slack_channel_id }}
          slack_thread_ts: ${{ steps.slack-routing.outputs.slack_thread_ts }}
          release_tag: ${{ github.event.inputs.release_tag }}
          url_prefix: ${{ steps.validate-inputs.outputs.url_prefix }}
          env: ${{ steps.validate-inputs.outputs.env_name }}
          packages_json: ${{ steps.upload.outputs.packages_json }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      # Whoever started the release from a Slack thread gets a link to the announcement channel message
      - name: Post announcement link to Slack
        continue-on-error: true
        if: |
          steps.slack-routing.outputs.slack_fanout_msg_links == '1' &&
          github.event.inputs.slack_channel_id != '' &&
          steps.slack-success.outputs.slack_url != ''
        uses: ./.github/actions/slack-notification
        with:
          slack_func: slack_format_simple_msg
          slack_channel_id: ${{ github.event.inputs.slack_channel_id }}
          slack_thread_ts: ${{ github.event.inputs.slack_thread_ts }}
          message: ${{ steps.slack-success.outputs.slack_url }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Create Release info
        shell: bash
        env:
          PACKAGES_JSON: ${{ steps.upload.outputs.packages_json }}
          INPUTS_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          INPUTS_RELEASE_TYPE: ${{ github.event.inputs.release_type }}
          SLACK_TS: ${{ steps.slack-success.outputs.slack_ts }}
          SLACK_CHANNEL_ID: ${{ steps.slack-success.outputs.slack_ts && steps.slack-routing.outputs.slack_channel_id || '' }}
          SLACK_MESSAGE_URL: ${{ steps.slack-success.outputs.slack_url }}
        run: |
          jq -n \
            --arg release_tag "$INPUTS_RELEASE_TAG" \
            --arg release_type "$INPUTS_RELEASE_TYPE" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson packages "$PACKAGES_JSON" \
            --arg slack_ts "$SLACK_TS" \
            --arg slack_channel_id "$SLACK_CHANNEL_ID" \
            --arg slack_message_url "$SLACK_MESSAGE_URL" \
            '{
              release_tag: $release_tag,
              release_type: $release_type,
              run_id: $run_id,
              packages: $packages,
              slack_ts: $slack_ts,
              slack_channel_id: $slack_channel_id,
              slack_message_url: $slack_message_url
            } | with_entries(select(.value != ""))' > result.json

      - name: Upload publish result artifact
        uses: actions/upload-artifact@v7
        with:
          name: release_info
          path: result.json
          retention-days: 90

      - name: Send Failure Slack notification
        id: slack-failure
        if: failure()
        uses: ./.github/actions/slack-notification
        with:
          slack_func: slack_format_failure_message
          slack_channel_id: ${{ steps.slack-routing.outputs.slack_channel_id || vars.SLACK_CHANNEL_ID }}
          slack_thread_ts: ${{ steps.slack-routing.outputs.slack_thread_ts }}
          release_tag: ${{ github.event.inputs.release_tag }}
          env: ${{ steps.validate-inputs.outputs.env_name }}
          message: ":package: Arch Linux package upload failed"
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      # Whoever started the release from a Slack thread gets a link to the announcement channel message
      - name: Post failure notification link to Slack
        continue-on-error: true
        if: |
          failure() &&
          steps.slack-routing.outputs.slack_fanout_msg_links == '1' &&
          github.event.inputs.slack_channel_id != '' &&
          steps.slack-failure.outputs.slack_url != ''
        uses: ./.github/actions/slack-notification
        with:
          slack_func: slack_format_simple_msg
          slack_channel_id: ${{ github.event.inputs.slack_channel_id }}
          slack_thread_ts: ${{ github.event.inputs.slack_thread_ts }}
          message: ${{ steps.slack-failure.outputs.slack_url }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
